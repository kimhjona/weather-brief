name: Morning weather brief

on:
  schedule:
    # This does not have to be 6:45 anywhere. The job hands ntfy a release time
    # and ntfy holds the message, so all this cron owes us is one run at some
    # point in the several hours beforehand. GitHub dispatches late by twenty
    # minutes to two hours and that no longer costs us the brief.
    # An odd minute, because GitHub is likeliest to drop a run scheduled on the
    # hour, when everyone else's crons fire too.
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send the brief
        env:
          WEATHER_LAT: ${{ secrets.WEATHER_LAT }}
          WEATHER_LON: ${{ secrets.WEATHER_LON }}
          WEATHER_LABEL: ${{ secrets.WEATHER_LABEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python weather.py send --deliver-at 06:45
